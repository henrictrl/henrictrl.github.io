<script>
(async function () {
  try {
    var response = await fetch('/projeto.html', { cache: 'no-cache' });
    if (!response.ok) throw new Error('Não foi possível carregar a página do projeto.');
    var html = await response.text();
    html = html.replace('<head>', '<head><base href="/">');
    html = html.replace(/href="#([^"]*)"/g, 'href="/es/projetos/portfolio/#$1"');
    html = html.replace('var slug = params.get("slug") || "";', 'var slug = params.get("slug") || "metaprojeto";');
    document.open(); document.write(html); document.close();
  } catch (error) {
    document.body.textContent = 'Não foi possível carregar este projeto. Volte ao portfólio e tente novamente.';
  }
})();
</script>
