<script>

(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var slug = params.get("slug") || "";
  var PROJECTS = window.PROJETOS || [];
  var POSTS = window.POSTS || [];
  var LANG_NAMES = {pt:"Português",en:"English",es:"Español"};
  function readLanguage() {
    try { var saved = localStorage.getItem("hm-lang"); if (saved && ["pt","en","es"].indexOf(saved)>=0) return saved; } catch(e) {}
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "pt"];
    for (var i=0;i<langs.length;i++) {
      var v=String(langs[i]).toLowerCase();
      if (/^pt/.test(v)) return "pt";
      if (/^es/.test(v)) return "es";
      if (/^en/.test(v)) return "en";
    }
    return "pt";
  }
  var LANG = readLanguage();
  function lx(value) {
    if (value == null) return "";
    if (typeof value === "string" || typeof value === "number") return String(value);
    if (Array.isArray(value)) return value;
    return value[LANG] != null ? value[LANG] : (value.pt != null ? value.pt : (value.en != null ? value.en : (value.es != null ? value.es : "")));
  }
  function esc(value) {
    return String(value == null ? "" : value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function textLabel(pt,en,es) { return ({pt:pt,en:en,es:es})[LANG]; }
  function fmtData(iso) {
    if (!iso || /^\d{4}$/.test(iso)) return iso || "";
    var bits=iso.split("-");
    var months={pt:["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],es:["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]};
    var month=months[LANG][Number(bits[1])-1];
    return LANG==="en" ? month+" "+Number(bits[2])+", "+bits[0] : Number(bits[2])+" "+month+" "+bits[0];
  }
  function igImg(post,index) { return post.cover && index===0 ? post.cover : "assets/posts/"+post.c+"/"+String(index+1).padStart(2,"0")+".webp"; }
  function igUrl(post) { return "https://www.instagram.com/"+(post.reel?"reel":"p")+"/"+post.c+"/"; }
  var postGroupNames={};
  PROJECTS.forEach(function(p) {
    if (p.posts) postGroupNames[p.posts]=postGroupNames[p.posts]||p.titulo;
    (p.postGroups||[]).forEach(function(g) { postGroupNames[g.g]=g.t||p.titulo; });
  });
  function pgProj(group) { return lx(postGroupNames[group]) || group; }
  function pgOrgName(user) {
    var map={persona:"Persona",unesp:"Unesp"}, data=(window.ENGAJAMENTO||{}).contas||{};
    return map[user] || (data[user]&&data[user].n) || user;
  }
  var POST_BY=Object.create(null);
  POSTS.forEach(function(p){POST_BY[p.c]=p;});
  var PROJECT_ROUTE_ALIASES = {"rino-site":"rino-cores","o-hobbit":"hobbit","metaprojeto":"portfolio","dash-geral":"visao-geral"};
  function cleanProjectUrl(projectSlug) { return "/projetos/" + (PROJECT_ROUTE_ALIASES[projectSlug] || projectSlug) + "/"; }
  var currentProject=PROJECTS.find(function(p){return p.slug===slug;});
  var main=document.getElementById("dk"), heading=document.getElementById("project-title");
  var kicker=document.getElementById("project-kicker");
  var intro=document.getElementById("project-intro"), visuals=document.getElementById("project-visuals");
  var toc=document.getElementById("project-toc"), langHost=document.getElementById("project-lang");
  var nextLink=document.getElementById("project-next");
  /* --- Cabeçalho: hambúrguer no celular, links centrais no desktop --- */
  var siteHeader=document.getElementById("project-header"), navToggle=document.getElementById("nav-toggle");
  function setMenu(open) {
    siteHeader.classList.toggle("menu-open", open);
    navToggle.setAttribute("aria-expanded", String(open));
    navToggle.setAttribute("aria-label", open ? textLabel("Fechar menu","Close menu","Cerrar menú") : textLabel("Abrir menu","Open menu","Abrir menú"));
    document.body.style.overflow = open ? "hidden" : "";
  }
  navToggle.addEventListener("click", function () { setMenu(!siteHeader.classList.contains("menu-open")); });
  siteHeader.querySelectorAll(".main-nav a").forEach(function (link) { link.addEventListener("click", function () { setMenu(false); }); });
  document.addEventListener("keydown", function (event) { if (event.key === "Escape" && siteHeader.classList.contains("menu-open")) setMenu(false); });
  matchMedia("(min-width: 768px)").addEventListener("change", function (event) { if (event.matches) setMenu(false); });
  /* altura real do cabeçalho → --hdr-h (painel do menu) e --project-header-height (sumário e âncoras) */
  function setHdr() {
    var h = siteHeader.offsetHeight + "px";
    document.documentElement.style.setProperty("--hdr-h", h);
    document.documentElement.style.setProperty("--project-header-height", h);
  }
  setHdr();
  window.addEventListener("resize", setHdr);
  var siteCopy={
    back:{pt:"Todos os projetos",en:"All projects",es:"Todos los proyectos"},
    try:{pt:"Abrir ferramenta interativa",en:"Open interactive tool",es:"Abrir herramienta interactiva"},
    screens:{pt:"Capturas de tela",en:"Screenshots",es:"Capturas de pantalla"},
    gallery:{pt:"Imagens feitas no Pixelar",en:"Images made with Pixelar",es:"Imágenes hechas con Pixelar"},
    posts:{pt:"Posts e carrosséis",en:"Posts and carousels",es:"Posts y carruseles"},
    related:{pt:"Projetos relacionados",en:"Related projects",es:"Proyectos relacionados"},
    build:{pt:"Construção",en:"How it was built",es:"Construcción"},
    notFound:{pt:"Projeto não encontrado",en:"Project not found",es:"Proyecto no encontrado"},
    notFoundText:{pt:"Este endereço não corresponde a um projeto publicado.",en:"This address does not match a published project.",es:"Esta dirección no corresponde a un proyecto publicado."},
    top:{pt:"Voltar ao topo ↑",en:"Back to top ↑",es:"Volver arriba ↑"},
    next:{pt:"Próximo projeto",en:"Next project",es:"Siguiente proyecto"},
    open:{pt:"Abrir site em nova aba ↗",en:"Open website in a new tab ↗",es:"Abrir sitio en una pestaña nueva ↗"}
  };
  function renderLanguageControls() {
    var NAV_L={
      home:{pt:"Início",en:"Home",es:"Inicio"},
      about:{pt:"Sobre",en:"About",es:"Sobre mí"},
      work:{pt:"Projetos",en:"Projects",es:"Proyectos"},
      articles:{pt:"Artigos",en:"Articles",es:"Artículos"},
      contact:{pt:"Contato",en:"Contact",es:"Contacto"}
    };
    siteHeader.querySelectorAll("[data-nav]").forEach(function (link) {
      var v=NAV_L[link.dataset.nav];
      link.textContent=textLabel(v.pt,v.en,v.es);
    });
    setMenu(siteHeader.classList.contains("menu-open"));
    var flags = {
      pt: '<svg viewBox="0 0 21 15" aria-hidden="true"><rect width="21" height="15" fill="#009C3B"/><path d="M10.5 1.6 19.3 7.5 10.5 13.4 1.7 7.5z" fill="#FFDF00"/><circle cx="10.5" cy="7.5" r="3.4" fill="#002776"/><path d="M7.3 6.8c2.1-.6 4.4-.3 6.3.9" stroke="#fff" stroke-width=".55" fill="none"/></svg>',
      en: '<svg viewBox="0 0 21 15" aria-hidden="true"><rect width="21" height="15" fill="#012169"/><path d="M0 0 21 15M21 0 0 15" stroke="#fff" stroke-width="3.6"/><path d="M0 0 21 15M21 0 0 15" stroke="#C8102E" stroke-width="1.5"/><path d="M10.5 0v15M0 7.5h21" stroke="#fff" stroke-width="5"/><path d="M10.5 0v15M0 7.5h21" stroke="#C8102E" stroke-width="2.7"/></svg>',
      es: '<svg viewBox="0 0 21 15" aria-hidden="true"><rect width="21" height="15" fill="#AA151B"/><rect y="3.75" width="21" height="7.5" fill="#F1BF00"/></svg>'
    };
    langHost.innerHTML=["pt","en","es"].map(function(code){
      return '<button type="button" class="lang-btn" data-lang="'+code+'" lang="'+code+'" aria-pressed="'+(code===LANG)+'" aria-label="'+LANG_NAMES[code]+'" title="'+LANG_NAMES[code]+'">'+flags[code]+'</button>';
    }).join("");
    langHost.querySelectorAll("[data-lang]").forEach(function(button){
      button.addEventListener("click",function(){
        var nextLang=button.dataset.lang; if(nextLang===LANG)return;
        try{localStorage.setItem("hm-lang",nextLang);}catch(e){}
        location.reload();
      });
    });
  }
  function postCard(post) {
    var n=Number(post.n)||1, cap=String(post.cap||"").trim(), longCap=cap.length>140, ar=(1/(Number(post.r)||1)).toFixed(4);
    var imgs=post.embed
      ? '<iframe src="https://www.instagram.com/p/'+esc(post.c)+'/embed/" title="'+esc(cap||"Instagram carousel")+'" loading="lazy" allowtransparency="true" frameborder="0" scrolling="no" style="display:block;flex:0 0 100%;min-width:100%;width:100%;height:640px;border:0;background:#fff"></iframe>'
      : Array.from({length:n},function(_,i){
        var src=igImg(post,i), image='<img src="'+esc(src)+'" alt="" loading="lazy" decoding="async" data-full="'+esc(src)+'">';
        return post.reel ? '<a class="ig-reel" href="'+esc(igUrl(post))+'" target="_blank" rel="noopener noreferrer">'+image+'</a>' : image;
      }).join("");
    return '<article class="pc" data-code="'+esc(post.c)+'" data-kind="'+(n>1&&!post.art?"car":"post")+'"><div class="pc-media" style="--ar:'+ar+'"><div class="pc-track">'+imgs+'</div>'+
      (n>1?'<button class="pc-nav pc-prev" type="button" aria-label="Anterior" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><button class="pc-nav pc-next" type="button" aria-label="Próxima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button><div class="pc-dots">'+Array.from({length:n},function(_,i){return '<span'+(i?"":' class="on"')+'></span>';}).join("")+'</div><span class="pc-count">1/'+n+'</span>':"")+
      '</div><div class="pc-body"><p class="pc-meta">@'+esc(post.user)+' — '+esc(fmtData(post.d))+'</p>'+
      (cap?'<p class="pc-cap'+(longCap?' clamp':'')+'">'+esc(cap)+'</p>'+(longCap?'<button class="ig-more" type="button">'+esc(textLabel("ver mais","more","ver más"))+'</button>':""):"")+
      '<div class="pc-links"><a href="'+esc(igUrl(post))+'" target="_blank" rel="noopener noreferrer">'+esc(textLabel("Ver no Instagram","View on Instagram","Ver en Instagram"))+' ↗</a>'+
      (post.art?'<a href="'+esc(post.art)+'" target="_blank" rel="noopener noreferrer">'+esc(textLabel("Ler o texto","Read the text","Leer el texto"))+'</a>':"")+'</div></div></article>';
  }
  function addTocBlock(list,id,label){list.push([id,label]);}
  function buildPosts(p,contentToc) {
    var groups=p.postGroups||(p.posts?[{g:p.posts}]:[]);
    var all=groups.reduce(function(arr,group){return arr.concat(POSTS.filter(function(post){return post.g===group.g;}));},[]);
    if(!all.length)return "";
    var postsCount=all.length, carouselCount=all.filter(function(post){return post.n>1&&!post.art;}).length, singleCount=postsCount-carouselCount;
    var filter=carouselCount&&singleCount?'<div class="pc-filter" role="group" aria-label="'+esc(textLabel("Filtrar publicações","Filter posts","Filtrar publicaciones"))+'">'+
      '<button type="button" class="art-filter" data-pk="all" aria-pressed="true">'+esc(textLabel("Todos","All","Todos"))+' <span>'+postsCount+'</span></button>'+
      '<button type="button" class="art-filter" data-pk="post" aria-pressed="false">'+esc(textLabel("Posts","Posts","Posts"))+' <span>'+singleCount+'</span></button>'+
      '<button type="button" class="art-filter" data-pk="car" aria-pressed="false">'+esc(textLabel("Carrosséis","Carousels","Carruseles"))+' <span>'+carouselCount+'</span></button></div>':"";
    var groupsHTML=groups.map(function(group,i){
      var items=POSTS.filter(function(post){return post.g===group.g;}); if(!items.length)return "";
      var id="dk-b-posts"+(group.t?"-"+i:""); if(group.t)addTocBlock(contentToc,id,group.t);
      return '<div class="pc-group" id="'+id+'">'+(group.t?'<div class="pc-group-head"><h4>'+esc(lx(group.t))+'</h4>'+(group.d?'<p>'+esc(lx(group.d))+'</p>':"")+'</div>':"")+
        '<div class="pc-grid'+(items.length>=4?' pc-4':'')+'">'+items.map(postCard).join("")+'</div></div>';
    }).join("");
    if(!groups.some(function(group){return group.t;}))addTocBlock(contentToc,"dk-b-posts-all",siteCopy.posts);
    return '<section class="dk-block pc-block" id="dk-b-posts-all"><h3 class="dk-block-title">'+esc(lx(siteCopy.posts))+'<span>'+postsCount+(postsCount===1?textLabel(" publicação"," post"," publicación"):textLabel(" posts"," posts"," posts"))+'</span></h3>'+filter+groupsHTML+'</section>';
  }


  const MESES = {
    pt: ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],
    en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
    es: ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']
  };
  const pcCard = postCard;

  const ENG = window.ENGAJAMENTO || { posts: {}, contas: {} };
  const T3 = (pt, en, es) => ({ pt, en, es });
  const PAL = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948']; // categórica validada (ordem fixa)
  const DS_L = {
    kInt: T3('Interações', 'Interactions', 'Interacciones'), kL: T3('curtidas', 'likes', 'me gusta'), kC: T3('comentários', 'comments', 'comentarios'),
    kPosts: T3('posts', 'posts', 'posts'), kContas: T3('contas', 'accounts', 'cuentas'), kMeses: T3('meses', 'months', 'meses'),
    kTaxa: T3('dos seguidores por post', 'of followers per post', 'de los seguidores por post'),
    resumo: T3('Resumo', 'Summary', 'Resumen'), topL: T3('Mais curtidos', 'Most liked', 'Con más me gusta'), topC: T3('Mais comentados', 'Most commented', 'Más comentados'),
    topD: T3('Clique para abrir o post.', 'Click to open the post.', 'Haz clic para abrir el post.'),
    cmp: T3('Comparações', 'Comparisons', 'Comparaciones'),
    tempo: T3('Ao longo do tempo', 'Over time', 'A lo largo del tiempo'), tempoD: T3('Interações somadas mês a mês e, abaixo, quanto entrou em cada mês.', 'Interactions added up month by month and, below, how many came in each month.', 'Interacciones sumadas mes a mes y, debajo, cuántas entraron cada mes.'),
    mapa: T3('Mapa de publicação', 'Posting map', 'Mapa de publicación'), mapaD: T3('Cada quadrado é um mês; quanto mais forte, mais interações.', 'Each square is a month; the stronger, the more interactions.', 'Cada cuadrado es un mes; cuanto más fuerte, más interacciones.'),
    menos: T3('menos', 'less', 'menos'), mais: T3('mais', 'more', 'más'),
    ano: T3('Por ano', 'By year', 'Por año'), anoD: T3('Total de interações por ano e a parte de cada um.', 'Total interactions per year and each one’s share.', 'Total de interacciones por año y la parte de cada uno.'),
    partU: T3('Participação por conta', 'Share by account', 'Participación por cuenta'), partG: T3('Participação por projeto', 'Share by project', 'Participación por proyecto'),
    partD: T3('Parte de cada um no total de interações.', 'Each one’s share of total interactions.', 'La parte de cada uno en el total de interacciones.'),
    bolhas: T3('Volume e resposta', 'Volume and response', 'Volumen y respuesta'), bolhasD: T3('Posts publicados (horizontal) e interações por post (vertical, escala log). O tamanho é o total.', 'Posts published (horizontal) and interactions per post (vertical, log scale). Size is the total.', 'Posts publicados (horizontal) e interacciones por post (vertical, escala log). El tamaño es el total.'),
    tab: T3('Contas', 'Accounts', 'Cuentas'), tabD: T3('Taxa = interações por post ÷ seguidores de hoje.', 'Rate = interactions per post ÷ current followers.', 'Tasa = interacciones por post ÷ seguidores actuales.'),
    cConta: T3('Conta', 'Account', 'Cuenta'), cPosts: T3('Posts', 'Posts', 'Posts'), cInt: T3('Interações', 'Interactions', 'Interacciones'), cPart: T3('Parte', 'Share', 'Parte'), cPP: T3('Por post', 'Per post', 'Por post'), cSeg: T3('Seguidores', 'Followers', 'Seguidores'), cTaxa: T3('Taxa', 'Rate', 'Tasa'),
    fmt: T3('Por formato', 'By format', 'Por formato'), fmtD: T3('Interações por post em cada formato.', 'Interactions per post in each format.', 'Interacciones por post en cada formato.'),

    blocks.push(screenHTML);
    if(project.slug==="rino-site"&&project.web){
      blocks.push('<section class="dk-block rino-case-block" id="dk-b-rino-case"><div class="rino-case-intro"><div><p class="rino-case-eyebrow">'+esc(textLabel("FERRAMENTA INTERATIVA","INTERACTIVE TOOL","HERRAMIENTA INTERACTIVA"))+'</p><p class="rino-case-description">'+esc(lx(project.intro))+'</p></div></div><div class="rino-case-frame"><iframe src="'+esc(project.web.url)+'" title="'+esc(project.titulo)+' — prévia não interativa" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div><div class="rino-case-intro"><a class="dk-try" href="'+esc(project.web.url)+'" target="_blank" rel="noopener noreferrer">'+esc(lx(siteCopy.try))+' ↗</a></div></section>');
      addTocBlock(contentToc,"dk-b-rino-case",{pt:"Ferramenta interativa",en:"Interactive tool",es:"Herramienta interactiva"});
    }
    if(project.shots&&project.shots.length&&project.slug!=="rino-site"){
      var desktopShots=project.shots.filter(function(s){return s.d!=="mobile";}), mobileShots=project.shots.filter(function(s){return s.d==="mobile";});
      blocks.push('<section class="dk-block" id="dk-b-shots"><h3 class="dk-block-title">'+esc(lx(siteCopy.screens))+(project.siteIntro?'<span>'+esc(lx(project.siteIntro))+'</span>':"")+
        (project.web?'<br><a class="dk-try" href="'+esc(project.web.url)+'" target="_blank" rel="noopener noreferrer">'+esc(lx(siteCopy.open))+'</a>':"")+'</h3>'+
        desktopShots.map(function(shot){return '<div class="shot-desk'+(shot.d==="pagina"?' shot-page':'')+'"><img src="'+esc(project.dir+shot.img)+'" alt="" loading="lazy" decoding="async"></div>';}).join("")+
        (mobileShots.length?'<div class="shot-phones">'+mobileShots.map(function(shot){return '<div class="shot-phone"><img src="'+esc(project.dir+shot.img)+'" alt="" loading="lazy" decoding="async"></div>';}).join("")+'</div>':"")+'</section>');
      addTocBlock(contentToc,"dk-b-shots",siteCopy.screens);
    }
    if(project.galeria&&project.galeria.length&&project.slug!=="pixelar"){
      blocks.push('<section class="dk-block" id="dk-b-gal"><h3 class="dk-block-title">'+esc(lx(siteCopy.gallery))+'</h3><div class="dk-gal">'+project.galeria.map(function(item){
        return '<button type="button" class="detail-gallery-item" data-lightbox="'+esc(project.dir+item)+'" aria-label="'+esc(textLabel("Ampliar imagem","Enlarge image","Ampliar imagen"))+'"><img src="'+esc(project.dir+item)+'" alt="" loading="lazy" decoding="async"></button>';
      }).join("")+'</div></section>');
      addTocBlock(contentToc,"dk-b-gal",siteCopy.gallery);
    }
    if(project.html==="meta"){
      initMeta();
      blocks.push(metaHTML());
      addTocBlock(contentToc,"dk-b-meta",siteCopy.build);
    }
    var postHTML=buildPosts(project,contentToc); if(postHTML)blocks.push(postHTML);
    if(project.dash){
      var dashboard=dashHTML(project);
      if(dashboard&&dashboard.html)blocks.push(dashboard.html);
      if(dashboard&&dashboard.toc)contentToc=contentToc.concat(dashboard.toc);
    }
    if(project.rel&&project.rel.length){
      var related=project.rel.map(function(relatedSlug){
        var item=PROJECTS.find(function(candidate){return candidate.slug===relatedSlug;}); if(!item)return "";
        return '<a class="work-card" href="'+cleanProjectUrl(item.slug)+'"><div class="work-card-media"><img src="'+esc(item.capa||"")+'" alt="" loading="lazy" decoding="async" width="1200" height="800"'+(item.capaPosicao?' style="object-position:'+esc(item.capaPosicao)+'"':"")+'></div><p class="work-card-title">'+esc(item.titulo)+'</p><p class="work-card-tag">'+esc(lx(item.cat||item.badge||""))+'</p></a>';
      }).join("");
      if(related)blocks.push('<section class="dk-rel" id="dk-b-related"><p>'+esc(lx(siteCopy.related))+'</p><div class="work-grid">'+related+'</div></section>');
    }
    visuals.innerHTML=blocks.join("");
    dsInit();
    var tocItems=(project.secoes||[]).map(function(section){return [section.p===1?"dk-top0":"dk-p"+section.p,section.t];}).concat(contentToc);
    toc.innerHTML=tocItems.map(function(item,index){return '<a href="#'+esc(item[0])+'" data-t="'+esc(item[0])+'"'+(index?"":' class="on"')+'>'+esc(lx(item[1]))+'</a>';}).join("");
    toc.hidden=tocItems.length<2;
    toc.parentNode.classList.toggle("no-toc",toc.hidden);
    var navigationProjects=PROJECTS;
    var navIndex=navigationProjects.findIndex(function(item){return item.slug===project.slug;});
    var next=navIndex>=0?navigationProjects[(navIndex+1)%navigationProjects.length]:null;
    if(next&&navigationProjects.length>1){nextLink.href=cleanProjectUrl(next.slug);nextLink.innerHTML='<span>'+esc(lx(siteCopy.next))+'</span>'+esc(next.titulo)+' →';nextLink.hidden=false;}
    else nextLink.hidden=true;
    renderLanguageControls();
    bindProjectInteractions();
    requestAnimationFrame(function(){var target=document.getElementById("project-top");if(target)target.scrollIntoView({behavior:"auto",block:"start"});updateToc();});
  }
  function bindProjectInteractions(){
    visuals.addEventListener("click",function(event){
      var filter=event.target.closest("[data-pk]");
      if(filter){
        var wrap=filter.closest(".pc-block");
        if(!wrap)return;
        wrap.querySelectorAll("[data-pk]").forEach(function(button){button.setAttribute("aria-pressed",String(button===filter));});
        wrap.querySelectorAll(".pc").forEach(function(card){card.hidden=filter.dataset.pk!=="all"&&card.dataset.kind!==filter.dataset.pk;});
        wrap.querySelectorAll(".pc-group").forEach(function(group){group.hidden=!group.querySelector(".pc:not([hidden])");});
        return;
      }
      var navButton=event.target.closest(".pc-nav");
      if(navButton){var track=navButton.parentNode.querySelector(".pc-track");if(track)track.scrollBy({left:(navButton.classList.contains("pc-next")?1:-1)*track.clientWidth,behavior:"smooth"});return;}
      var more=event.target.closest(".ig-more");
      if(more){var caption=more.previousElementSibling,on=caption.classList.toggle("clamp");more.textContent=lx(on?textLabel("ver mais","more","ver más"):textLabel("ver menos","less","ver menos"));return;}
      var rinoPiece=event.target.closest(".rino-piece");
      if(rinoPiece){openLightbox(rinoPiece.dataset.lightbox,rinoPiece.querySelector("img")?.alt||"");return;}
      var galleryButton=event.target.closest(".detail-gallery-item, .dk-gal button");
      if(galleryButton){openLightbox(galleryButton.dataset.lightbox,galleryButton.querySelector("img")?.alt||"");return;}
      var postImage=event.target.closest(".pc-track img");
      if(postImage&&!postImage.closest("a.ig-reel")){openLightbox(postImage.dataset.full||postImage.src,postImage.alt||"");return;}
      var dashboardPost=event.target.closest(".ds [data-post]");
      if(dashboardPost){var post=POST_BY[dashboardPost.dataset.post];if(post)window.open(igUrl(post),"_blank","noopener,noreferrer");}
    });
    visuals.querySelectorAll(".pc-track").forEach(function(track){
      function updateCarousel(){
        var card=track.closest(".pc"),i=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));
        var dots=card&&card.querySelector(".pc-dots");
        if(dots)Array.from(dots.children).forEach(function(dot,index){dot.classList.toggle("on",index===i);});
        var prev=card&&card.querySelector(".pc-prev"),next=card&&card.querySelector(".pc-next");
        if(prev)prev.disabled=i<=0;if(next)next.disabled=i>=track.children.length-1;
        var count=card&&card.querySelector(".pc-count");if(count)count.textContent=(i+1)+"/"+track.children.length;
      }
      track.addEventListener("scroll",updateCarousel,{passive:true});updateCarousel();
    });
  }
  function updateToc(){
    if(!toc||toc.hidden)return;
    var active=null;
    toc.querySelectorAll("a").forEach(function(link){
      var target=document.getElementById(link.dataset.t);
      if(!target&&link.dataset.t==="dk-top0")target=document.getElementById("project-top");
      if(target&&target.getBoundingClientRect().top<=180)active=link;
    });
    toc.querySelectorAll("a").forEach(function(link){link.classList.toggle("on",link===active);});
  }
  function openLightbox(src,alt){
    var overlay=document.getElementById("project-lightbox"),img=document.getElementById("project-lightbox-img");
    img.src=src;img.alt=alt||"";overlay.classList.add("open");document.body.style.overflow="hidden";document.getElementById("project-lightbox-close").focus();
  }
  function closeLightbox(){
    var overlay=document.getElementById("project-lightbox");
    if(!overlay.classList.contains("open"))return;
    overlay.classList.remove("open");document.body.style.overflow="";document.getElementById("project-lightbox-img").src="";
  }
  document.getElementById("project-lightbox-close").addEventListener("click",closeLightbox);
  document.getElementById("project-lightbox").addEventListener("click",function(event){
    if(event.target.id==="project-lightbox"||event.target.classList.contains("lightbox-stage"))closeLightbox();
  });
  document.addEventListener("keydown",function(event){if(event.key==="Escape")closeLightbox();});
  var shareButton = document.getElementById("project-share");
  var shareFeedback = document.getElementById("project-share-feedback");
  if (shareButton) shareButton.addEventListener("click", async function () {
    var shareUrl = window.location.origin + cleanProjectUrl(slug || (currentProject && currentProject.slug) || "");
    if (shareFeedback) shareFeedback.textContent = "";
    try {
      if (navigator.share) {
        await navigator.share({ url: shareUrl });
        if (shareFeedback) shareFeedback.textContent = textLabel("Compartilhamento aberto.", "Share sheet opened.", "Compartir abierto.");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(shareUrl);
      } else {
        var copyField = document.createElement("textarea");
        copyField.value = shareUrl; copyField.setAttribute("readonly", "");
        copyField.style.position = "fixed"; copyField.style.opacity = "0";
        document.body.appendChild(copyField); copyField.select();
        var copied = document.execCommand("copy"); copyField.remove();
        if (!copied) throw new Error("copy failed");
      }
      if (shareFeedback) shareFeedback.textContent = textLabel("Link copiado.", "Link copied.", "Enlace copiado.");
    } catch (error) {
      if (error && error.name === "AbortError") return;
      if (shareFeedback) shareFeedback.textContent = textLabel("Não foi possível compartilhar. Copie o endereço do navegador.", "Could not share. Copy the browser address.", "No se pudo compartir. Copia la dirección del navegador.");
    }
  });
  document.addEventListener("click",function(event){
    var backTop=event.target.closest("[data-project-top]");
    if(backTop){event.preventDefault();window.scrollTo({top:0,behavior:"smooth"});}
    var navLink=event.target.closest("#project-toc a[data-t]");
    if(navLink){
      event.preventDefault();
      var target=document.getElementById(navLink.dataset.t);
      if(navLink.dataset.t==="dk-top0")target=document.getElementById("project-top");
      if(target){var top=target.getBoundingClientRect().top+window.scrollY-92;window.scrollTo({top:Math.max(0,top),behavior:"smooth"});}
    }
  });
  window.addEventListener("scroll",updateToc,{passive:true});
  const mobileTopButton = document.getElementById("project-mobile-top-button");
  const updateMobileTopButton = () => {
    if (!mobileTopButton) return;
    const mobile = window.matchMedia("(max-width: 767px)").matches;
    mobileTopButton.classList.toggle("is-visible", mobile && window.scrollY > 480);
    mobileTopButton.setAttribute("aria-label", lx(siteCopy.top).replace(" ↑", ""));
    mobileTopButton.setAttribute("title", lx(siteCopy.top).replace(" ↑", ""));
  };
  if (mobileTopButton) {
    mobileTopButton.addEventListener("click", () => {
      const behavior = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
      window.scrollTo({ top: 0, behavior });
    });
    window.addEventListener("scroll", updateMobileTopButton, { passive: true });
    window.addEventListener("resize", updateMobileTopButton);
    updateMobileTopButton();
  }
  if(!currentProject){
    heading.textContent=lx(siteCopy.notFound);
    document.getElementById("project-not-found-title").textContent=lx(siteCopy.notFound);
    kicker.textContent="404";intro.textContent=lx(siteCopy.notFoundText);
    document.getElementById("project-not-found").hidden=false;
    document.getElementById("project-content-root").hidden=true;
    document.title=lx(siteCopy.notFound)+" — Henrique Marinhos";
    renderLanguageControls();
  }else buildProject(currentProject);
})();

</script>
