<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f5">
<title>Teste de contato — Henrique Marinhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #111111;
  --gray-400: #b2b2b2;
  --gray-500: #8c8c8c;
  --gray-100: #f5f5f5;
  --gray-200: #e5e5e5;
  --white: #ffffff;
  --gutter: clamp(22px, 4.4vw, 48px);
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--gray-100); }
body {
  min-height: 100%;
  margin: 0;
  color: var(--ink);
  background: var(--gray-100);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
.contact-footer {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  min-height: 100svh;
  overflow: hidden;
  padding: 0 var(--gutter);
  background: var(--gray-100);
}
.tools-float {
  position: absolute;
  top: 0;
  bottom: 57px;
  left: 50%;
  transform: translateX(-50%);
  width: min(1024px, calc(100% - 2 * var(--gutter)));
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
}
.tool-ic {
  position: absolute;
  top: 0;
  left: 0;
  width: 44px;
  height: 44px;
  opacity: .96;
  pointer-events: none;
  user-select: none;
  will-change: transform;
}
.tool-ic svg { display: block; width: 100%; height: 100%; }
.footer-inner {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 230px;
  align-items: start;
  gap: clamp(28px, 5vw, 88px);
  width: min(1024px, 100%);
  flex: 1 0 auto;
  margin: 0 auto;
  padding: clamp(72px, 15vh, 142px) 0 74px;
  pointer-events: none;
}
.footer-headline {
  width: min(100%, 475px);
  margin: 0;
  font-size: clamp(30px, 3.6vw, 42px);
  font-weight: 300;
  letter-spacing: -.035em;
  line-height: 1.08;
  text-wrap: balance;
}
.footer-socials {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 20px;
  padding-top: 2px;
  text-align: right;
}
.footer-social {
  display: inline-block;
  width: fit-content;
  max-width: 100%;
  color: var(--gray-400);
  font-size: clamp(20px, 2.2vw, 27px);
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -.025em;
  transition: color .22s ease;
  pointer-events: auto;
}
.footer-social:hover, .footer-social:focus-visible { color: var(--ink); }
.footer-headline { pointer-events: auto; }
.credit-bar {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 57px;
  margin: 0 calc(-1 * var(--gutter));
  padding: 14px var(--gutter);
  border-top: 1px solid var(--gray-200);
  background: rgba(245,245,245,.97);
  color: var(--gray-500);
  font-size: 12px;
  text-align: center;
}
@media (max-width: 767px) {
  .tools-float { bottom: 57px; }
  .tool-ic { width: 29px; height: 29px; }
  .footer-inner {
    grid-template-columns: minmax(0, 1fr);
    gap: 30px;
    padding: 42px 0 86px;
  }
  .footer-headline {
    width: 100%;
    max-width: 400px;
    font-size: clamp(29px, 8.1vw, 36px);
    line-height: 1.08;
  }
  .footer-socials {
    display: flex;
    flex-flow: row wrap;
    justify-content: flex-start;
    align-items: flex-start;
    gap: 17px 24px;
    padding-top: 0;
    text-align: left;
    max-width: 100%;
  }
  .footer-social {
    font-size: clamp(20px, 5.7vw, 24px);
    line-height: 1.1;
  }
  .credit-bar { min-height: 57px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<footer class="contact-footer" id="contato">
  <div class="tools-float" id="tools-float" aria-hidden="true"></div>
  <div class="footer-inner" id="footer-inner">
    <h1 class="footer-headline">Vamos trabalhar juntos?</h1>
    <nav class="footer-socials" aria-label="Contato e redes">
      <a href="mailto:henriquemarinhos@icloud.com" class="footer-social">E-mail</a>
      <a href="https://www.linkedin.com/in/henrique-marinhos/" class="footer-social" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://wa.me/5514991394590" class="footer-social" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a href="http://lattes.cnpq.br/8181966688647381" class="footer-social" target="_blank" rel="noopener noreferrer">Lattes</a>
      <a href="https://substack.com/@henrictrl" class="footer-social" target="_blank" rel="noopener noreferrer">Substack</a>
    </nav>
  </div>
  <div class="credit-bar">Site desenhado e desenvolvido por Henrique Marinhos.</div>
</footer>
<script src="assets/data/ferramentas.js"></script>
<script>
(() => {
  const foot = document.getElementById('contato');
  const box = document.getElementById('tools-float');
  const title = foot.querySelector('.footer-headline');
  const links = [...foot.querySelectorAll('.footer-social')];
  const data = Array.isArray(window.FERRAMENTAS) ? window.FERRAMENTAS : [];
  if (!box || !data.length) return;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobileQuery = window.matchMedia('(max-width: 767px)');
  // Os ícones vêm da mesma coleção usada pelo portfólio; só a quantidade muda conforme o espaço.
  box.innerHTML = data.map(item => '<div class="tool-ic" aria-hidden="true">' + item.svg + '</div>').join('');
  const elements = [...box.children];
  let bodies = [];
  let W = 0, H = 0, size = 44, radius = 22, obstacles = [];
  let raf = 0, last = 0, time = 0, visible = true;
  const pointer = { x: -10000, y: -10000, active: false };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const circleRectHit = (b, r) => b.x > r.x && b.x < r.x + r.w && b.y > r.y && b.y < r.y + r.h;

  function setPosition(b) {
    const angle = Math.sin(time * .48 + b.phase) * (mobileQuery.matches ? 2.2 : 3.8);
    b.el.style.transform = 'translate3d(' + (b.x - radius).toFixed(2) + 'px,' + (b.y - radius).toFixed(2) + 'px,0) rotate(' + angle.toFixed(2) + 'deg)';
  }

  function rebuild() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    const rect = box.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    if (!W || !H) return;
    size = elements[0] ? elements[0].getBoundingClientRect().width : 44;
    radius = size / 2;
    const limit = mobileQuery.matches ? 7 : 14;
    obstacles = [title, ...links].map(el => {
      const r = el.getBoundingClientRect();
      // Margem invisível: os logotipos não invadem os textos nem os links.
      const pad = radius + (mobileQuery.matches ? 7 : 10);
      return {
        x: r.left - rect.left - pad,
        y: r.top - rect.top - pad,
        w: r.width + pad * 2,
        h: r.height + pad * 2
      };
    });

    bodies = [];
    const minGap = size + (mobileQuery.matches ? 5 : 8);
    elements.forEach((el, index) => {
      el.style.display = 'none';
      if (index >= limit) return;
      let chosen = null;
      let bestScore = -Infinity;
      // Procura espaços válidos por amostragem: se estiver apertado, oculta o ícone em vez de o deixar escapar.
      for (let attempt = 0; attempt < 420; attempt++) {
        const x = radius + 1 + Math.random() * Math.max(1, W - size - 2);
        const y = radius + 1 + Math.random() * Math.max(1, H - size - 2);
        const candidate = { x, y };
        if (obstacles.some(o => circleRectHit(candidate, o))) continue;
        let clearance = Infinity;
        for (const b of bodies) clearance = Math.min(clearance, dist(candidate, b));
        if (clearance < minGap) continue;
        // Evita concentrar todos os ícones na mesma região, mantendo espaço de colisão.
        const centerBias = -Math.hypot(x - W * .5, y - H * .55) * .003;
        const score = (clearance === Infinity ? 600 : Math.min(clearance, 600)) + centerBias + Math.random() * 20;
        if (score > bestScore) { bestScore = score; chosen = candidate; }
      }
      if (!chosen) return;
      el.style.display = 'block';
      const phase = Math.random() * Math.PI * 2;
      bodies.push({
        el,
        x: chosen.x,
        y: chosen.y,
        ax: chosen.x,
        ay: chosen.y,
        vx: 0,
        vy: 0,
        phase,
        seed: Math.random() * Math.PI * 2
      });
    });
    bodies.forEach(setPosition);
    if (!reduceMotion && visible) wake();
  }

  function resolveEdges(b) {
    if (b.x < radius) { b.x = radius; b.vx = Math.abs(b.vx) * .42; }
    if (b.x > W - radius) { b.x = W - radius; b.vx = -Math.abs(b.vx) * .42; }
    if (b.y < radius) { b.y = radius; b.vy = Math.abs(b.vy) * .42; }
    if (b.y > H - radius) { b.y = H - radius; b.vy = -Math.abs(b.vy) * .42; }
  }

  function resolveObstacles(b) {
    for (const o of obstacles) {
      if (!circleRectHit(b, o)) continue;
      const left = Math.abs(b.x - o.x);
      const right = Math.abs(o.x + o.w - b.x);
      const top = Math.abs(b.y - o.y);
      const bottom = Math.abs(o.y + o.h - b.y);
      const edge = Math.min(left, right, top, bottom);
      if (edge === left) { b.x = o.x; b.vx = -Math.abs(b.vx) * .35; }
      else if (edge === right) { b.x = o.x + o.w; b.vx = Math.abs(b.vx) * .35; }
      else if (edge === top) { b.y = o.y; b.vy = -Math.abs(b.vy) * .35; }
      else { b.y = o.y + o.h; b.vy = Math.abs(b.vy) * .35; }
    }
    resolveEdges(b);
  }

  function resolvePairs() {
    const min = size + (mobileQuery.matches ? 4 : 7);
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const a = bodies[i], b = bodies[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if (d >= min) continue;
        if (d < .001) { dx = .01; dy = 0; d = .01; }
        const nx = dx / d, ny = dy / d;
        const overlap = (min - d) * .5;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;
        const closing = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (closing < 0) {
          const impulse = -closing * .36;
          a.vx -= nx * impulse; a.vy -= ny * impulse;
          b.vx += nx * impulse; b.vy += ny * impulse;
        }
        resolveObstacles(a);
        resolveObstacles(b);
      }
    }
  }

  function wake() {
    if (reduceMotion || !visible || raf) return;
    last = performance.now();
    raf = requestAnimationFrame(tick);
  }

  function tick(now) {
    raf = 0;
    const dt = clamp((now - last) / 1000 || .016, .001, .024);
    last = now;
    time += dt;
    const speedLimit = mobileQuery.matches ? 20 : 42;
    for (const b of bodies) {
      // Molas leves mantêm cada ícone no seu espaço; pequenas forças laterais dão sensação de gravidade e flutuação.
      const spring = mobileQuery.matches ? .22 : .18;
      b.vx += (b.ax - b.x) * spring * dt + Math.sin(time * .7 + b.seed) * (mobileQuery.matches ? 1.0 : 2.8) * dt;
      b.vy += (b.ay - b.y) * spring * dt + Math.cos(time * .61 + b.seed) * (mobileQuery.matches ? 1.0 : 2.8) * dt;
      if (pointer.active && !mobileQuery.matches) {
        const dx = b.x - pointer.x, dy = b.y - pointer.y;
        const d = Math.hypot(dx, dy) || .01;
        const range = 118;
        if (d < range) {
          const force = (1 - d / range) ** 2 * 100;
          b.vx += dx / d * force * dt;
          b.vy += dy / d * force * dt;
        }
      }
      const damp = Math.exp(-(mobileQuery.matches ? 2.4 : 1.7) * dt);
      b.vx *= damp;
      b.vy *= damp;
      const velocity = Math.hypot(b.vx, b.vy);
      if (velocity > speedLimit) { b.vx *= speedLimit / velocity; b.vy *= speedLimit / velocity; }
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      resolveObstacles(b);
      resolveEdges(b);
    }
    resolvePairs();
    bodies.forEach(setPosition);
    if (visible) raf = requestAnimationFrame(tick);
  }

  footPointerEvents();
  function footPointerEvents() {
    foot.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
      const r = box.getBoundingClientRect();
      pointer.x = e.clientX - r.left;
      pointer.y = e.clientY - r.top;
      pointer.active = true;
    }, { passive: true });
    foot.addEventListener('pointerleave', () => { pointer.active = false; });
    window.addEventListener('blur', () => { pointer.active = false; });
  }

  const observer = new IntersectionObserver(entries => {
    visible = !!entries[0].isIntersecting;
    if (visible) wake();
    else if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }, { threshold: 0.01 });
  observer.observe(foot);
  let resizeFrame = 0;
  function scheduleRebuild() {
    if (resizeFrame) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      resizeFrame = 0;
      rebuild();
    });
  }
  window.addEventListener('resize', scheduleRebuild, { passive: true });
  mobileQuery.addEventListener('change', scheduleRebuild);
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(scheduleRebuild);
    ro.observe(foot.querySelector('.footer-inner'));
    ro.observe(box);
  }
  document.fonts.ready.then(scheduleRebuild);
  rebuild();
})();
</script>
</body>
</html>
